<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hued map</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="page.css">
</head>
<body>
<main id="main">
  <h1 id="title">Pick colors for <code id="target">this directory</code></h1>
  <p class="sub" id="sub">Loading&hellip;</p>

  <canvas id="map" width="1440" height="600"></canvas>
  <div class="bar">
    <span class="label">Suggest from</span>
    <label><input type="radio" name="band" value="any" checked> any lightness</label>
    <label><input type="radio" name="band" value="dark"> dark only</label>
    <label><input type="radio" name="band" value="light"> light only</label>
    <span class="readout" id="readout"></span>
  </div>

  <div class="slots" id="slots" role="radiogroup" aria-label="The color being picked">
    <span class="label">Picking</span>
    <span class="custom">
      <input type="color" id="custom" aria-label="Any color">
      <input class="field" id="hex" type="text" autocomplete="off" spellcheck="false"
             placeholder="#rrggbb" aria-label="Hex color">
      <button class="link" id="revert" type="button">revert</button>
    </span>
  </div>

  <div class="cols">
    <div><div class="label">Widest gaps</div><div class="tray" id="gaps"></div></div>
    <div><div class="label">From your click</div>
      <div class="tray" id="clicked"><span class="empty">Click the map for swatches at that spot.</span></div></div>
  </div>

  <div class="panel">
    <div>
      <div class="label">Preview</div>
      <div class="term" id="term"></div>
      <div class="actions">
        <button class="use" id="use" type="button" disabled>Use these</button>
        <button class="link" id="copy" type="button" disabled>copy command</button>
      </div>
      <div class="note" id="note"></div>
    </div>
    <div><div class="label">Closest existing backgrounds</div><div id="near"></div></div>
    <div>
      <div class="label">Slug</div>
      <input class="field" id="slug" type="text" autocomplete="off" spellcheck="false"
             placeholder="the directory's name" aria-label="Slug">
      <div class="label">Symbol</div>
      <input class="field" id="sym" type="text" autocomplete="off" spellcheck="false"
             placeholder="SF Symbol name" aria-label="Symbol name">
      <div class="note" id="symnote"></div>
      <div id="syms"></div>
    </div>
  </div>
</main>

<script src="page.js"></script>
</body>
</html>
